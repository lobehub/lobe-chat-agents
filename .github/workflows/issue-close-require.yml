name: Issue Close Require

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  issue-check-inactive:
    permissions:
      issues: write # for actions-cool/issues-helper to update issues
      pull-requests: write # for actions-cool/issues-helper to update PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.LOBEHUB_BOT_APP_ID }}
          private-key: ${{ secrets.LOBEHUB_BOT_APP_PRIVATE_KEY }}
      - name: check-inactive
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'check-inactive'
          token: ${{ steps.app-token.outputs.token }}
          inactive-label: 'Inactive'
          inactive-day: 30

  issue-close-require:
    permissions:
      issues: write # for actions-cool/issues-helper to update issues
      pull-requests: write # for actions-cool/issues-helper to update PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.LOBEHUB_BOT_APP_ID }}
          private-key: ${{ secrets.LOBEHUB_BOT_APP_PRIVATE_KEY }}
      - name: need reproduce
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'close-issues'
          token: ${{ steps.app-token.outputs.token }}
          labels: '✅ Fixed'
          inactive-day: 3
          body: |
            👋 @{{ github.event.issue.user.login }}
            <br/>
            Since the issue was labeled with `✅ Fixed`, but no response in 3 days. This issue will be closed. If you have any questions, you can comment and reply.\
            由于该 issue 被标记为已修复，同时 3 天未收到回应。现关闭 issue，若有任何问题，可评论回复。
      - name: need reproduce
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'close-issues'
          token: ${{ steps.app-token.outputs.token }}
          labels: '🤔 Low Quality'
          inactive-day: 3
          body: |
            👋 @{{ github.event.issue.user.login }}
            <br/>
            Since the issue was labeled with `🤔 Low Quality`, but no response in 3 days. This issue will be closed. If you have any questions, you can comment and reply.\
            由于该 issue 被标记为低质量提示词，却 3 天未收到回应。现关闭 issue，可以改进后重新开启 issue，若有任何问题，可评论回复。
      - name: need reproduce
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'close-issues'
          token: ${{ steps.app-token.outputs.token }}
          labels: "🙅🏻‍♀️ WON'T DO"
          inactive-day: 3
          body: |
            👋 @{{ github.event.issue.user.login }}
            <br/>
            Since the issue was labeled with `🙅🏻‍♀️ WON'T DO`, and no response in 3 days. This issue will be closed. If you have any questions, you can comment and reply.\
            由于该 issue 被标记为暂不处理，同时 3 天未收到回应。现关闭 issue，若有任何问题，可评论回复。
